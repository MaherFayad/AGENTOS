; ============================================================================
; GENERATED FILE — DO NOT EDIT BY HAND.
;
; Source of truth: the `schedule:` field in agents/**/SKILL.md (spec §3.2, Part IV).
; Generator:       scripts/sync-ofelia.mjs        (owner: runner-engineer, M7)
; Trigger:         the runner runs the generator after a schedule commit, then
;                  `docker compose kill -s HUP ofelia` to reload.
;
; A job that exists here but not in frontmatter is a BUG, not a feature. The generator
; rewrites this file wholesale from the agent library; anything you type by hand is gone
; on the next schedule change, and in the meantime the MAP's clock badges — which read
; frontmatter, never this file — will disagree with what actually runs.
;
; To schedule an agent: POST /api/schedule, or edit its frontmatter and commit.
; ============================================================================

[global]
; Log to stdout so `docker compose logs ofelia` is the whole story.
save-only-on-error = false

; ----------------------------------------------------------------------------
; EXAMPLE JOB — this is the exact shape the generator emits. It is commented out
; because `agents/` has no scheduled agent yet, and an example that actually fired
; would be a fake number in the run history (CLAUDE.md rule 9).
; ----------------------------------------------------------------------------
;
; One job per agent whose frontmatter has `schedule:`. The section name is
; `job-run "<department>/<agent-slug>"` so the job id round-trips to a repo path.
;
; job-run (not job-exec) because a throwaway curl container needs nothing from the
; runner image: the schedule fires the same public POST /api/run that the drawer's
; ▶ Run now button fires. One code path, scheduled or manual.
;
; [job-run "sales/account-enrichment"]
; schedule = 0 6 * * 1
; image    = curlimages/curl:8.11.1
; network  = agnetos_cc
; delete   = true
; command  = curl -fsS -X POST http://runner:8787/api/run
;            -H "Content-Type: application/json"
;            -d "{\"agent\":\"sales/account-enrichment\",\"inputs\":{}}"
;
; Notes for the generator:
;   - `schedule` is copied verbatim from frontmatter. Five-field cron only; ofelia's Go
;     cron would also accept a six-field (seconds) form, and then the same string would
;     mean two different things depending on who parsed it.
;   - `network` must be the compose network name, which infra/compose.yaml pins to
;     `agnetos_cc` so this string never has to guess at a project-name prefix.
;   - No secrets in this file. It is committed; the runner reads its own API key from the
;     environment (Part V billing split).
